<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Castle Chaos 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100%;
    height:100%;
}

#scene{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

.ui{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.logo{
    padding:10px 14px;
    border-radius:14px;
    background:rgba(15,23,42,.82);
    color:white;
    font-size:18px;
    font-weight:900;
}

.gold{
    padding:10px 14px;
    border-radius:14px;
    background:rgba(15,23,42,.82);
    color:white;
    font-weight:bold;
}

.controls{
    position:absolute;
    bottom:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 10px;
}

button{
    border:2px solid rgba(255,255,255,.25);
    border-radius:16px;
    background:rgba(20,30,50,.92);
    color:white;
    padding:12px 14px;
    min-width:95px;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 5px 0 rgba(0,0,0,.35);
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 rgba(0,0,0,.35);
}

.message{
    position:absolute;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    padding:9px 16px;
    border-radius:20px;
    background:rgba(15,23,42,.75);
    color:white;
    font-weight:bold;
    pointer-events:none;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

    <div id="scene"></div>

    <div class="ui">
        <div class="logo">🏰 CASTLE CHAOS</div>
        <div class="gold">🪙 <span id="gold">100</span></div>
    </div>

    <div class="message" id="message">
        Birlik seç ve saldır!
    </div>

    <div class="controls">
        <button onclick="sendKnight()">⚔️ ŞÖVALYE</button>
        <button onclick="sendArcher()">🏹 OKÇU</button>
        <button onclick="sendGiant()">🔨 DEV</button>
    </div>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

/* =========================
   SAHNE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    25,
    90
);


/* =========================
   KAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    200
);

camera.position.set(
    0,
    14,
    25
);

camera.lookAt(
    0,
    3,
    0
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* =========================
   IŞIK
========================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        2
    );

scene.add(ambient);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    -10,
    20,
    10
);

sun.castShadow = true;

scene.add(sun);


/* =========================
   ZEMİN
========================= */

const groundGeometry =
    new THREE.PlaneGeometry(
        80,
        50
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x4f8f32
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   YOL
========================= */

const roadGeometry =
    new THREE.PlaneGeometry(
        9,
        50
    );

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0xb88a5a
    });

const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );

road.rotation.x =
    -Math.PI / 2;

road.position.y =
    0.02;

scene.add(road);


/* =========================
   KALE OLUŞTUR
========================= */

function createCastle(x,color){

    const castle =
        new THREE.Group();

    castle.position.x = x;

    /* ana bina */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                6,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    body.position.y = 3;

    body.castShadow = true;

    castle.add(body);


    /* kuleler */

    [-2.7,2.7].forEach(
        towerX => {

            const tower =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.7,
                        8,
                        2
                    ),
                    new THREE.MeshStandardMaterial({
                        color:color
                    })
                );

            tower.position.set(
                towerX,
                4,
                0
            );

            tower.castShadow = true;

            castle.add(tower);


            /* kule tepesi */

            const roof =
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        1.35,
                        2.2,
                        4
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x432818
                    })
                );

            roof.position.set(
                towerX,
                9,
                0
            );

            roof.rotation.y =
                Math.PI / 4;

            roof.castShadow = true;

            castle.add(roof);

        }
    );


    /* kapı */

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                2.5,
                .25
            ),
            new THREE.MeshStandardMaterial({
                color:0x3b2415
            })
        );

    door.position.set(
        0,
        1.25,
        -2.05
    );

    castle.add(door);


    /* bayrak */

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .05,
                .05,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:0x4b3621
            })
        );

    pole.position.set(
        0,
        8,
        0
    );

    castle.add(pole);


    const flag =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1.6,
                .9
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                side:THREE.DoubleSide
            })
        );

    flag.position.set(
        .75,
        8.8,
        0
    );

    castle.add(flag);


    scene.add(castle);

    return castle;
}


/* =========================
   KALELER
========================= */

const playerCastle =
    createCastle(
        -16,
        0x4169e1
    );

const enemyCastle =
    createCastle(
        16,
        0xb83232
    );


/* =========================
   KARAKTER
========================= */

function createKnight(){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .65,
                1.3,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x355c9b
            })
        );

    body.position.y = 1.5;

    body.castShadow = true;

    group.add(body);


    const helmet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .7,
                12,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0xbfc7d5,
                metalness:.5
            })
        );

    helmet.position.y = 2.8;

    helmet.castShadow = true;

    group.add(helmet);


    const sword =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                2,
                .3
            ),
            new THREE.MeshStandardMaterial({
                color:0xdce6f2,
                metalness:.8
            })
        );

    sword.position.set(
        .9,
        1.6,
        0
    );

    sword.rotation.z =
        -0.5;

    sword.castShadow = true;

    group.add(sword);


    group.scale.set(
        1.1,
        1.1,
        1.1
    );

    return group;
}


/* =========================
   ŞÖVALYE
========================= */

let knight = null;
let attacking = false;

function sendKnight(){

    if(attacking) return;

    attacking = true;

    document.getElementById(
        "message"
    ).innerText =
        "⚔️ Şövalye saldırıyor!";

    knight =
        createKnight();

    knight.position.set(
        -11,
        0,
        0
    );

    scene.add(knight);

    animateKnight();
}


function animateKnight(){

    if(!knight) return;

    knight.position.x += .16;

    knight.rotation.y =
        Math.sin(
            Date.now() * .01
        ) * .05;

    if(
        knight.position.x >= 12
    ){

        enemyHit();

        scene.remove(knight);

        knight = null;

        attacking = false;

        return;
    }

    requestAnimationFrame(
        animateKnight
    );
}


/* =========================
   KALE VURUŞU
========================= */

function enemyHit(){

    enemyCastle.scale.set(
        1.08,
        .94,
        1.08
    );

    setTimeout(()=>{
        enemyCastle.scale.set(
            1,
            1,
            1
        );
    },180);

    document.getElementById(
        "message"
    ).innerText =
        "💥 Kale vuruldu!";
}


/* =========================
   DİĞER BİRLİKLER
========================= */

function sendArcher(){

    document.getElementById(
        "message"
    ).innerText =
        "🏹 Okçu sistemi geliyor...";
}

function sendGiant(){

    document.getElementById(
        "message"
    ).innerText =
        "🔨 Dev sistemi geliyor...";
}


/* =========================
   ANİMASYON
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   EKRAN BOYUTU
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
