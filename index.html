<html lang="tr">
<head>

<title>Castle Chaos 3D</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

#scene{
    position:absolute;
    inset:0;
}

canvas{
    display:block;

/* =========================
   ÜST PANEL
========================= */

.topbar{

    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;

    pointer-events:none;
}

.logo{

    background:rgba(15,23,42,.90);

    color:white;

    padding:12px 16px;

    border-radius:16px;

    font-size:18px;

    font-weight:900;

    box-shadow:

}

.gold{

    background:rgba(15,23,42,.90);

    color:white;

    padding:12px 16px;

    border-radius:16px;

    font-size:17px;

    font-weight:bold;

    box-shadow:
    0 5px 12px rgba(0,0,0,.25);
}


/* =========================
   MESAJ
========================= */

#message{

    position:absolute;

    top:78px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    background:rgba(15,23,42,.85);

    color:white;

    padding:10px 18px;

    border-radius:22px;

    font-weight:bold;

    font-size:15px;

    box-shadow:

/* =========================
   KONTROLLER
========================= */

.controls{

    position:absolute;

    bottom:16px;

    left:10px;
    right:10px;

}

.unitButton{

    flex:1;

    max-width:125px;

    min-height:68px;

    border-radius:18px;

    font-weight:900;

}

.unitButton:active{

    transform:translateY(5px);

    0 1px 0 #111827;
}


/* =========================
   CANVAS ÜSTÜ YAZILAR
========================= */

.castleLabel{

    position:absolute;

    z-index:8;

    color:white;

    background:rgba(0,0,0,.55);

    padding:5px 9px;

    border-radius:10px;

    font-size:12px;

    font-weight:bold;

    pointer-events:none;

    display:none;
}

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* =====================================================
   SAHNE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x82d3f5
    );

scene.fog =
    new THREE.Fog(
        0x82d3f5,
        35,
        90
    );


/* =====================================================
   KAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth /
        window.innerHeight,
        .1,
        150
    );

camera.position.set(
    0,
    12,
    27
);

camera.lookAt(
    0,
    3,
    0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
        "high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.8
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
.getElementById("scene")
.appendChild(
    renderer.domElement
);


/* =====================================================
   IŞIKLAR
===================================================== */

const skyLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x507040,
        2.5
    );

scene.add(
    skyLight
);


const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sunlight.position.set(
    -15,
    25,
    15
);

sunlight.castShadow =
    true;

sunlight.shadow.mapSize.width =
    1024;

sunlight.shadow.mapSize.height =
    1024;

scene.add(
    sunlight
);


/* =====================================================
   ZEMİN
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            60,
            70
        ),

        new THREE.MeshStandardMaterial({
            color:0x4f9d35,
            roughness:1
        })

    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow =
    true;

scene.add(
    ground
);


/* =====================================================
   SAVAŞ YOLU
===================================================== */

const road =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            9,
            70
        ),

        new THREE.MeshStandardMaterial({
            color:0xc99a63,
            roughness:1
        })

    );

road.rotation.x =
    -Math.PI / 2;

road.position.y =
    .02;

scene.add(
    road
);


/* =====================================================
   YOL KENARLARI
===================================================== */

function createStone(
    x,
    z,
    scale
){

    const stone =
        new THREE.Mesh(

            new THREE.DodecahedronGeometry(
                .5,
                0
            ),

            new THREE.MeshStandardMaterial({
                color:0x777777
            })

        );

    stone.position.set(
        x,
        .35,
        z
    );

    stone.scale.setScalar(
        scale
    );

    stone.rotation.y =
        Math.random()*3;

    stone.castShadow =
        true;

    scene.add(
        stone
    );
}


for(
    let z=-30;
    z<=30;
    z+=6
){

    createStone(
        -6-Math.random()*2,
        z,
        .5+Math.random()*.5
    );

    createStone(
        6+Math.random()*2,
        z,
        .5+Math.random()*.5
    );

}


/* =====================================================
   AĞAÇ
===================================================== */

function createTree(
    x,
    z
){

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .25,
                .35,
                2,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x6b4226
            })

        );

    trunk.position.y =
        1;

    trunk.castShadow =
        true;

    tree.add(
        trunk
    );


    const leaves =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                1.3,
                3,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x237a35
            })

        );

    leaves.position.y =
        3;

    leaves.castShadow =
        true;

    tree.add(
        leaves
    );


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(
        tree
    );
}


createTree(
    -10,
    -12
);

createTree(
    10,
    -7
);

createTree(
    -10,
    4
);

createTree(
    10,
    10
);


/* =====================================================
   KALE FONKSİYONU
===================================================== */

function createCastle(
    z,
    mainColor
){

    const castle =
        new THREE.Group();

    castle.position.z =
        z;


    /* ANA BİNA */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                6,
                5.5,
                4
            ),

            new THREE.MeshStandardMaterial({
                color:mainColor,
                roughness:.8
            })

        );

    body.position.y =
        2.75;

    body.castShadow =
        true;

    body.receiveShadow =
        true;

    castle.add(
        body
    );


    /* KULELER */

    [-3.3,3.3]
    .forEach(
        x => {

            const tower =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        2,
                        7,
                        2.4
                    ),

                    new THREE.MeshStandardMaterial({
                        color:mainColor
                    })

                );

            tower.position.set(
                x,
                3.5,
                0
            );

            tower.castShadow =
                true;

            castle.add(
                tower
            );


            /* ÇATI */

            const roof =
                new THREE.Mesh(

                    new THREE.ConeGeometry(
                        1.7,
                        2.5,
                        4
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x542b20
                    })

                );

            roof.position.set(
                x,
                8.25,
                0
            );

            roof.rotation.y =
                Math.PI / 4;

            roof.castShadow =
                true;

            castle.add(
                roof
            );

        }
    );


    /* KAPI */

    const door =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.7,
                2.7,
                .3
            ),

            new THREE.MeshStandardMaterial({
                color:0x392015
            })

        );

    door.position.set(
        0,
        1.35,
        z < 0 ? 2.05 : -2.05
    );

    castle.add(
        door
    );


    /* BAYRAK DİREĞİ */

    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .06,
                .06,
                3.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x3d2b1f
            })

        );

    pole.position.set(
        0,
        9,
        0
    );

    castle.add(
        pole
    );


    /* BAYRAK */

    const flag =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                2,
                1.1
            ),

            new THREE.MeshStandardMaterial({

                color:mainColor,

                side:
                THREE.DoubleSide

            })

        );

    flag.position.set(
        1,
        9.5,
        0
    );

    castle.add(
        flag
    );


    /* CAN BAR ARKA PLAN */

    const hpBack =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                4,
                .45
            ),

            new THREE.MeshBasicMaterial({
                color:0x202020,
                side:THREE.DoubleSide
            })

        );

    hpBack.position.set(
        0,
        10.2,
        0
    );

    castle.add(
        hpBack
    );


    /* CAN */

    const hpFill =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                3.8,
                .28
            ),

            new THREE.MeshBasicMaterial({
                color:0x22c55e,
                side:THREE.DoubleSide
            })

        );

    hpFill.position.set(
        0,
        10.2,
        -.03
    );

    castle.add(
        hpFill
    );


    castle.userData.hp =
        100;

    castle.userData.hpFill =
        hpFill;


    scene.add(
        castle
    );


    return castle;
}


/* =====================================================
   KALELER
===================================================== */

const playerCastle =
    createCastle(
        24,
        0x3976d3
    );


const enemyCastle =
    createCastle(
        -24,
        0xc83b3b
    );


/* =====================================================
   ŞÖVALYE
===================================================== */

function createKnight(){

    const knight =
        new THREE.Group();


    /* GÖVDE */

    const body =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .65,
                1.25,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x315ca8,
                roughness:.7
            })

        );

    body.position.y =
        1.45;

    body.castShadow =
        true;

    knight.add(
        body
    );


    /* KAFA */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .62,
                12,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0xf0c7a4
            })

        );

    head.position.y =
        2.7;

    head.castShadow =
        true;

    knight.add(
        head
    );


    /* KASK */

    const helmet =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .72,
                12,
                8,
                0,
                Math.PI*2,
                0,
                Math.PI*.55
            ),

            new THREE.MeshStandardMaterial({
                color:0xbcc6d4,
                metalness:.7,
                roughness:.3
            })

        );

    helmet.position.y =
        2.75;

    helmet.castShadow =
        true;

    knight.add(
        helmet
    );


    /* KILIC */

    const sword =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .18,
                2.2,
                .3
            ),

            new THREE.MeshStandardMaterial({
                color:0xe7edf5,
                metalness:.9,
                roughness:.2
            })

        );

    sword.position.set(
        .9,
        1.65,
        0
    );

    sword.rotation.z =
        -.45;

    sword.castShadow =
        true;

    knight.add(
        sword
    );


    /* KOL */

    const arm =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .18,
                .8,
                4,
                6
            ),

            new THREE.MeshStandardMaterial({
                color:0x315ca8
            })

        );

    arm.position.set(
        .65,
        1.8,
        0
    );

    arm.rotation.z =
        -.5;

    arm.castShadow =
        true;

    knight.add(
        arm
    );


    knight.scale.set(
        1.15,
        1.15,
        1.15
    );


    return knight;
}


/* =====================================================
   ŞÖVALYE SALDIRISI
===================================================== */

let activeKnight =
    null;

let attacking =
    false;


function sendKnight(){

    if(attacking)
        return;


    attacking =
        true;


    document.getElementById(
        "message"
    ).innerText =
        "⚔️ Şövalye saldırıyor!";


    activeKnight =
        createKnight();


    activeKnight.position.set(
        0,
        0,
        18
    );


    activeKnight.rotation.y =
        Math.PI;


    scene.add(
        activeKnight
    );


    moveKnight();
}


function moveKnight(){

    if(!activeKnight)
        return;


    activeKnight.position.z -=
        .16;


    /* KOŞMA HAREKETİ */

    activeKnight.position.y =
        Math.abs(
            Math.sin(
                Date.now()*.012
            )
        )*.08;


    if(
        activeKnight.position.z
        <= -18
    ){

        damageEnemy();


        scene.remove(
            activeKnight
        );

        activeKnight =
            null;

        attacking =
            false;

        return;
    }


    requestAnimationFrame(
        moveKnight
    );
}


/* =====================================================
   DÜŞMANA HASAR
===================================================== */

function damageEnemy(){

    enemyCastle.userData.hp -=
        10;


    if(
        enemyCastle.userData.hp < 0
    ){

        enemyCastle.userData.hp =
            0;

    }


    updateHP();


    /* SARSILMA */

    enemyCastle.scale.set(
        1.08,
        .94,
        1.08
    );


    setTimeout(
        ()=>{

            enemyCastle.scale.set(
                1,
                1,
                1
            );

        },
        180
    );


    if(
        enemyCastle.userData.hp <= 0
    ){

        document.getElementById(
            "message"
        ).innerText =
            "🏆 ZAFER! Düşman kalesi yıkıldı!";

        document.getElementById(
            "gold"
        ).innerText =
            Number(
                document.getElementById(
                    "gold"
                ).innerText
            ) + 50;

    }
    else{

        document.getElementById(
            "message"
        ).innerText =
            "💥 Düşman kalesi hasar aldı!";

    }

}


/* =====================================================
   CAN BARLARI
===================================================== */

function updateHP(){

    enemyCastle
    .userData
    .hpFill
    .scale.x =
        enemyCastle.userData.hp / 100;

}

   OKÇU
