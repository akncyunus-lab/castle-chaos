<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Castle Chaos 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08111f;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:rgba(9,18,34,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 25px rgba(0,0,0,.28);backdrop-filter:blur(10px);border-radius:18px;padding:11px 15px}
.logo{font-size:20px;font-weight:900;letter-spacing:.4px}
.gold{font-size:18px;font-weight:800}
#status{position:absolute;top:83px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:16px;padding:10px 18px;border-radius:18px;background:rgba(9,18,34,.78);box-shadow:0 7px 20px rgba(0,0,0,.22)}
#hpWrap{position:absolute;top:127px;left:50%;transform:translateX(-50%);width:min(420px,78vw);display:flex;gap:8px}
.hpBox{flex:1;background:rgba(5,10,20,.75);border-radius:10px;padding:5px;border:1px solid rgba(255,255,255,.15)}
.hpTitle{font-size:10px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:8px;background:#253047;overflow:hidden}
.fill{height:100%;width:100%;transition:width .25s}
#pFill{background:#35d07f}#eFill{background:#ff5b5b}
#controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(620px,94vw);display:flex;gap:10px;pointer-events:auto}
.unitBtn{flex:1;min-height:66px;border:1px solid rgba(255,255,255,.16);border-bottom:5px solid rgba(0,0,0,.28);border-radius:17px;background:linear-gradient(#33435c,#202c40);color:#fff;font-size:13px;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.3);touch-action:manipulation}
.unitBtn span{display:block;font-size:26px;margin-bottom:2px}
.unitBtn.selected{border-color:#ffd12e;box-shadow:0 0 20px rgba(255,209,46,.34);transform:translateY(-2px)}
.unitBtn:active{transform:scale(.97)}
#newGame{position:absolute;right:16px;bottom:105px;pointer-events:auto;border:0;border-radius:13px;padding:10px 14px;background:#1d6eea;color:white;font-weight:900;box-shadow:0 7px 18px rgba(0,0,0,.3)}
#hint{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
@media(max-width:500px){
 .logo{font-size:17px}.panel{padding:9px 12px}.topbar{top:10px;left:10px;right:10px}
 #status{top:69px;font-size:14px}.hpWrap{top:110px}
 #controls{bottom:10px;gap:7px}.unitBtn{min-height:62px;border-radius:15px}
 #newGame{bottom:91px;right:10px}.hint{display:none}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
  <div class="topbar">
    <div class="panel logo">🏰 CASTLE CHAOS <small style="opacity:.55">3D</small></div>
    <div class="panel gold">🪙 <span id="gold">100</span></div>
  </div>
  <div id="status">Birlik seç ve saldır!</div>
  <div id="hpWrap">
    <div class="hpBox"><div class="hpTitle"><span>🟢 SENİN KALE</span><span id="pText">100</span></div><div class="bar"><div class="fill" id="pFill"></div></div></div>
    <div class="hpBox"><div class="hpTitle"><span>🔴 DÜŞMAN</span><span id="eText">100</span></div><div class="bar"><div class="fill" id="eFill"></div></div></div>
  </div>
  <div id="hint">Birlik seç → saldırıyı izle</div>
  <button id="newGame">↻ Yeni Savaş</button>
  <div id="controls">
    <button class="unitBtn selected" data-unit="knight"><span>⚔️</span>ŞÖVALYE</button>
    <button class="unitBtn" data-unit="archer"><span>🏹</span>OKÇU</button>
    <button class="unitBtn" data-unit="giant"><span>🔨</span>DEV</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x75c9e8);
scene.fog = new THREE.Fog(0x75c9e8, 28, 70);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 150);
camera.position.set(0, 12, 22);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff7ff,0x49643a,2.2));
const sun = new THREE.DirectionalLight(0xfff1cf,3.2);
sun.position.set(-12,20,12); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
scene.add(sun);

const mats = {
  grass:new THREE.MeshStandardMaterial({color:0x4d9f45,roughness:.95}),
  path:new THREE.MeshStandardMaterial({color:0xc59a66,roughness:1}),
  stone:new THREE.MeshStandardMaterial({color:0x8c96a3,roughness:.85}),
  darkStone:new THREE.MeshStandardMaterial({color:0x394454,roughness:.9}),
  wood:new THREE.MeshStandardMaterial({color:0x603c26,roughness:1}),
  roof:new THREE.MeshStandardMaterial({color:0x8e2930,roughness:.9}),
  metal:new THREE.MeshStandardMaterial({color:0x9da8b8,metalness:.5,roughness:.35}),
  gold:new THREE.MeshStandardMaterial({color:0xf4bd24,metalness:.7,roughness:.25}),
  skin:new THREE.MeshStandardMaterial({color:0xc98761,roughness:.9}),
  cloth:new THREE.MeshStandardMaterial({color:0x285ec2,roughness:.8}),
  enemyCloth:new THREE.MeshStandardMaterial({color:0xb8323b,roughness:.8}),
  white:new THREE.MeshStandardMaterial({color:0xe9edf3,roughness:.8}),
  black:new THREE.MeshStandardMaterial({color:0x202733,roughness:.8})
};

function box(w,h,d,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(r,h,mat,x=0,y=0,z=0,seg=12){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cone(r,h,mat,x=0,y=0,z=0,seg=4){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}

box(55,.4,55,mats.grass,0,-.25,0);
box(8,.12,42,mats.path,0,-.02,0);

function castle(x, enemy=false){
  const g=new THREE.Group();g.position.x=x;g.position.z=enemy?-14:14;g.rotation.y=enemy?Math.PI:0;scene.add(g);
  const base=new THREE.Mesh(new THREE.BoxGeometry(7,6,5),mats.stone);base.position.y=3;base.castShadow=true;base.receiveShadow=true;g.add(base);
  for(const sx of [-3,3]){
    const tower=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.45,8,8),mats.stone);
    tower.position.set(sx,4,0);tower.castShadow=true;tower.receiveShadow=true;g.add(tower);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(1.7,2.2,8),mats.roof);roof.position.set(sx,9,0);roof.castShadow=true;g.add(roof);
  }
  const door=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.5,.25),mats.wood);door.position.set(0,1.25,2.55);g.add(door);
  for(const z of [-2.65,2.65]) for(let i=-2;i<=2;i++){
    const batt=new THREE.Mesh(new THREE.BoxGeometry(.65,1,.65),mats.darkStone);batt.position.set(i*1.15,6.5,z);batt.castShadow=true;g.add(batt);
  }
  return g;
}
const playerCastle=castle(0,false), enemyCastle=castle(0,true);

const clouds=[];
for(let i=0;i<8;i++){
  const c=new THREE.Group();
  for(let j=0;j<4;j++) cyl(.9,.55,mats.white,-1+j*.9,0,0,12);
  c.children.forEach(m=>{m.position.y=15+Math.random()*4;m.position.z=-25+Math.random()*30});
  c.position.x=-24+Math.random()*48;c.position.z=-25+Math.random()*25;scene.add(c);clouds.push(c);
}

const unitData={
 knight:{damage:12,speed:7,cost:10,color:0x2b66d0,icon:'⚔️'},
 archer:{damage:8,speed:9,cost:12,color:0x3f8a45,icon:'🏹'},
 giant:{damage:24,speed:4,cost:20,color:0x9b5c2e,icon:'🔨'}
};
let selected='knight', gold=100, enemyHP=100, playerHP=100, busy=false, gameOver=false;

function makeUnit(type){
  const d=unitData[type], g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(type==='giant'?0.85:.48,type==='giant'?1:.55,type==='giant'?1.8:1.15,10),new THREE.MeshStandardMaterial({color:d.color,roughness:.8}));
  body.position.y=1.1;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(type==='giant'?.7:.43,12,10),mats.skin);head.position.y=2.05;head.castShadow=true;g.add(head);
  if(type==='knight'){
    const helmet=new THREE.Mesh(new THREE.ConeGeometry(.48,.5,8),mats.metal);helmet.position.y=2.38;helmet.castShadow=true;g.add(helmet);
    const sword=new THREE.Mesh(new THREE.BoxGeometry(.12,1.7,.16),mats.metal);sword.position.set(.7,1.45,0);sword.rotation.z=-.35;sword.castShadow=true;g.add(sword);
  }
  if(type==='archer'){
    const bow=new THREE.Mesh(new THREE.TorusGeometry(.55,.07,8,16,Math.PI),mats.wood);bow.position.set(.65,1.45,0);bow.rotation.y=Math.PI/2;g.add(bow);
  }
  if(type==='giant'){
    const hammer=new THREE.Mesh(new THREE.BoxGeometry(.28,1.8,.28),mats.wood);hammer.position.set(.95,1.2,0);hammer.rotation.z=-.45;g.add(hammer);
    const head2=new THREE.Mesh(new THREE.BoxGeometry(.8,.5,.5),mats.metal);head2.position.set(1.35,1.95,0);g.add(head2);
  }
  return g;
}

function projectile(type,from,to){
  const d=unitData[type], m=new THREE.Mesh(new THREE.SphereGeometry(type==='archer'?.11:.16,8,8),new THREE.MeshStandardMaterial({color:type==='archer'?0x8b5a2b:0xffd34d,emissive:type==='archer'?0x000000:0x5a3d00}));
  m.position.copy(from);scene.add(m);
  const start=performance.now(),dur=type==='archer'?450:300;
  function step(now){
    const t=Math.min((now-start)/dur,1), p=from.clone().lerp(to,t);p.y+=Math.sin(t*Math.PI)*2;
    m.position.copy(p);
    if(t<1) requestAnimationFrame(step); else {scene.remove(m); impact(type);}
  }
  requestAnimationFrame(step);
}
function impact(type){
  enemyHP=Math.max(0,enemyHP-unitData[type].damage); updateUI();
  if(enemyHP<=0){gameOver=true;gold+=50;document.getElementById('status').textContent='🏆 ZAFER! +50 ALTIN';}
  else setTimeout(enemyAttack,650);
}
function enemyAttack(){
  if(gameOver)return;
  playerHP=Math.max(0,playerHP-7);updateUI();
  if(playerHP<=0){gameOver=true;document.getElementById('status').textContent='💀 KALE YIKILDI!';}
}
function attack(type){
  if(busy||gameOver)return;
  if(gold<unitData[type].cost){document.getElementById('status').textContent='🪙 Yeterli altın yok!';return}
  gold-=unitData[type].cost;updateUI();busy=true;
  document.getElementById('status').textContent=unitData[type].icon+' Birlik ilerliyor...';
  const u=makeUnit(type);u.position.set(0,.1,9);scene.add(u);
  const startZ=9,endZ=-10,start=performance.now(),dur=1300*7/unitData[type].speed;
  function move(now){
    const t=Math.min((now-start)/dur,1), eased=t*t*(3-2*t);
    u.position.z=startZ+(endZ-startZ)*eased;
    u.rotation.y=Math.PI;
    if(t<1)requestAnimationFrame(move);
    else{
      scene.remove(u);busy=false;
      document.getElementById('status').textContent='💥 Saldırı!';
      projectile(type,new THREE.Vector3(0,2,-10),new THREE.Vector3(0,3,-13));
    }
  }
  requestAnimationFrame(move);
}
function updateUI(){
  document.getElementById('gold').textContent=gold;
  document.getElementById('pText').textContent=playerHP;
  document.getElementById('eText').textContent=enemyHP;
  document.getElementById('pFill').style.width=playerHP+'%';
  document.getElementById('eFill').style.width=enemyHP+'%';
}
function reset(){
  gold=100;enemyHP=100;playerHP=100;busy=false;gameOver=false;updateUI();
  document.getElementById('status').textContent='Birlik seç ve saldır!';
}
document.querySelectorAll('.unitBtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    selected=btn.dataset.unit;
    document.querySelectorAll('.unitBtn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    attack(selected);
  });
});
document.getElementById('newGame').onclick=reset;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.05);last=now;
  clouds.forEach((c,i)=>{c.position.x+=dt*(.25+i*.03);if(c.position.x>30)c.position.x=-30});
  renderer.render(scene,camera);
}
updateUI();animate(performance.now());
</script>
</body>
</html>
