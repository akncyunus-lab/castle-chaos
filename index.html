<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Castle Chaos 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#topbar{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.panel{
    background:rgba(15,23,42,.92);
    color:white;
    border:2px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:12px 18px;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
    font-weight:bold;
}

.title{
    font-size:20px;
}

.gold{
    font-size:19px;
}

#message{
    position:absolute;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    background:rgba(15,23,42,.9);
    border-radius:25px;
    padding:10px 20px;
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

#controls{
    position:absolute;
    bottom:15px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    gap:10px;
}

.unitButton{
    flex:1;
    min-height:72px;
    border:2px solid #475569;
    border-radius:20px;
    background:linear-gradient(#334155,#1e293b);
    color:white;
    font-weight:bold;
    font-size:16px;
    box-shadow:
        0 7px 0 #0f172a,
        0 12px 22px rgba(0,0,0,.35);
}

.unitButton:active{
    transform:translateY(5px);
    box-shadow:
        0 2px 0 #0f172a,
        0 5px 12px rgba(0,0,0,.3);
}

.unitButton.selected{
    border-color:#fbbf24;
    box-shadow:
        0 7px 0 #92400e,
        0 0 20px rgba(251,191,36,.45);
}

.icon{
    display:block;
    font-size:28px;
    margin-bottom:3px;
}

#restart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    display:none;
    padding:16px 28px;
    border:0;
    border-radius:18px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.hpWrap{
    position:absolute;
    width:180px;
    height:18px;
    z-index:20;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.hpBg{
    width:100%;
    height:100%;
    border:2px solid white;
    border-radius:10px;
    background:#111827;
    overflow:hidden;
}

.hpFill{
    height:100%;
    width:100%;
    background:#22c55e;
    transition:width .25s;
}

.hpText{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:12px;
    font-weight:bold;
    text-shadow:0 2px 3px black;
}

@media(max-width:500px){
    .title{
        font-size:17px;
    }

    .panel{
        padding:10px 13px;
    }

    #message{
        font-size:15px;
        top:78px;
    }

    .unitButton{
        min-height:68px;
        font-size:14px;
    }

    .icon{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="topbar">

        <div class="panel title">
            🏰 CASTLE CHAOS
        </div>

        <div class="panel gold">
            🪙 <span id="gold">100</span>
        </div>

    </div>

    <div id="message">
        Birlik seç ve saldır!
    </div>

    <div id="playerHP" class="hpWrap">
        <div class="hpText">DOST KALESİ</div>
        <div class="hpBg">
            <div id="playerFill" class="hpFill"></div>
        </div>
    </div>

    <div id="enemyHP" class="hpWrap">
        <div class="hpText">DÜŞMAN KALESİ</div>
        <div class="hpBg">
            <div id="enemyFill" class="hpFill"></div>
        </div>
    </div>

    <div id="controls">

        <button class="unitButton selected"
                onclick="selectUnit('knight')"
                id="knightBtn">
            <span class="icon">⚔️</span>
            ŞÖVALYE
        </button>

        <button class="unitButton"
                onclick="selectUnit('archer')"
                id="archerBtn">
            <span class="icon">🏹</span>
            OKÇU
        </button>

        <button class="unitButton"
                onclick="selectUnit('giant')"
                id="giantBtn">
            <span class="icon">🔨</span>
            DEV
        </button>

    </div>

    <button id="restart" onclick="resetGame()">
        🔄 YENİ SAVAŞ
    </button>

</div>

<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   CASTLE CHAOS 3D
   ===================================================== */

let scene;
let camera;
let renderer;
let clock;

let selectedUnit = "knight";

let enemyHealth = 100;
let playerHealth = 100;
let gold = 100;

let gameOver = false;
let attacking = false;

let playerCastle;
let enemyCastle;

let activeUnits = [];

const unitData = {

    knight:{
        damage:12,
        speed:4,
        color:0x2563eb
    },

    archer:{
        damage:8,
        speed:5,
        color:0x16a34a
    },

    giant:{
        damage:25,
        speed:2.2,
        color:0x7c3aed
    }

};


/* =====================================================
   SAHNE
   ===================================================== */

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x87ceeb);

    clock = new THREE.Clock();


    /* KAMERA */

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        200
    );

    camera.position.set(
        0,
        14,
        24
    );

    camera.lookAt(
        0,
        2,
        0
    );


    /* RENDERER */

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* IŞIK */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x667788,
            2
        );

    scene.add(ambient);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -10,
        25,
        15
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    scene.add(sun);


    createWorld();

    playerCastle =
        createCastle(-9,0,0);

    enemyCastle =
        createCastle(9,0,0);


    updateHPPositions();

    window.addEventListener(
        "resize",
        onResize
    );

    animate();
}


/* =====================================================
   DÜNYA
   ===================================================== */

function createWorld(){

    /* ÇİM */

    const groundGeo =
        new THREE.PlaneGeometry(
            60,
            60
        );

    const groundMat =
        new THREE.MeshStandardMaterial({
            color:0x4d9f3a,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            groundGeo,
            groundMat
        );

    ground.rotation.x =
        -Math.PI/2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* SAVAŞ YOLU */

    const roadGeo =
        new THREE.PlaneGeometry(
            10,
            45
        );

    const roadMat =
        new THREE.MeshStandardMaterial({
            color:0xc99a63,
            roughness:1
        });

    const road =
        new THREE.Mesh(
            roadGeo,
            roadMat
        );

    road.rotation.x =
        -Math.PI/2;

    road.position.y = .02;

    road.receiveShadow = true;

    scene.add(road);


    /* YOL KENARLARI */

    for(let z=-20; z<20; z+=4){

        createTree(-8,z);
        createTree(8,z);
    }


    /* BULUTLAR */

    createCloud(-10,12,-8);
    createCloud(7,14,-5);
    createCloud(0,16,-10);
}


/* =====================================================
   AĞAÇ
   ===================================================== */

function createTree(x,z){

    const trunkGeo =
        new THREE.CylinderGeometry(
            .25,
            .35,
            2,
            8
        );

    const trunkMat =
        new THREE.MeshStandardMaterial({
            color:0x6b4226
        });

    const trunk =
        new THREE.Mesh(
            trunkGeo,
            trunkMat
        );

    trunk.position.set(
        x,
        1,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const leavesGeo =
        new THREE.SphereGeometry(
            1.3,
            10,
            8
        );

    const leavesMat =
        new THREE.MeshStandardMaterial({
            color:0x166534
        });

    const leaves =
        new THREE.Mesh(
            leavesGeo,
            leavesMat
        );

    leaves.position.set(
        x,
        2.6,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);
}


/* =====================================================
   BULUT
   ===================================================== */

function createCloud(x,y,z){

    const group =
        new THREE.Group();

    const mat =
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });

    for(let i=0;i<4;i++){

        const geo =
            new THREE.SphereGeometry(
                1.4,
                12,
                8
            );

        const cloud =
            new THREE.Mesh(
                geo,
                mat
            );

        cloud.position.x =
            (i-1.5)*1.4;

        cloud.position.y =
            Math.sin(i)*.4;

        group.add(cloud);
    }

    group.position.set(
        x,y,z
    );

    scene.add(group);
}


/* =====================================================
   KALE
   ===================================================== */

function createCastle(x,y,z){

    const castle =
        new THREE.Group();

    castle.position.set(
        x,y,z
    );


    const stoneMat =
        new THREE.MeshStandardMaterial({
            color:0x9ca3af,
            roughness:.8
        });


    const darkStone =
        new THREE.MeshStandardMaterial({
            color:0x4b5563,
            roughness:.8
        });


    /* ANA BİNA */

    const bodyGeo =
        new THREE.BoxGeometry(
            5,
            6,
            4
        );

    const body =
        new THREE.Mesh(
            bodyGeo,
            stoneMat
        );

    body.position.y = 3;

    body.castShadow = true;

    body.receiveShadow = true;

    castle.add(body);


    /* KULELER */

    createTower(
        castle,
        -2.3,
        3.8,
        0,
        stoneMat,
        darkStone
    );

    createTower(
        castle,
        2.3,
        3.8,
        0,
        stoneMat,
        darkStone
    );


    /* KAPI */

    const doorGeo =
        new THREE.BoxGeometry(
            1.3,
            2.4,
            .35
        );

    const doorMat =
        new THREE.MeshStandardMaterial({
            color:0x4a2817
        });

    const door =
        new THREE.Mesh(
            doorGeo,
            doorMat
        );

    door.position.set(
        0,
        1.2,
        -2.08
    );

    castle.add(door);


    /* BAYRAK */

    const poleGeo =
        new THREE.CylinderGeometry(
            .05,
            .05,
            3,
            8
        );

    const poleMat =
        new THREE.MeshStandardMaterial({
            color:0x5b4636
        });

    const pole =
        new THREE.Mesh(
            poleGeo,
            poleMat
        );

    pole.position.set(
        0,
        9,
        0
    );

    castle.add(pole);


    const flagGeo =
        new THREE.PlaneGeometry(
            1.4,
            .8
        );

    const flagMat =
        new THREE.MeshStandardMaterial({
            color:
                x < 0
                ? 0x2563eb
                : 0xdc2626,
            side:THREE.DoubleSide
        });

    const flag =
        new THREE.Mesh(
            flagGeo,
            flagMat
        );

    flag.position.set(
        .7,
        9.1,
        0
    );

    flag.rotation.y =
        Math.PI/2;

    castle.add(flag);


    scene.add(castle);

    return castle;
}


/* =====================================================
   KULE
   ===================================================== */

function createTower(
    castle,
    x,
    y,
    z,
    stoneMat,
    darkStone
){

    const towerGeo =
        new THREE.BoxGeometry(
            1.8,
            7,
            2
        );

    const tower =
        new THREE.Mesh(
            towerGeo,
            stoneMat
        );

    tower.position.set(
        x,
        y,
        z
    );

    tower.castShadow = true;

    castle.add(tower);


    /* KULE ÇATISI */

    const roofGeo =
        new THREE.ConeGeometry(
            1.5,
            1.8,
            4
        );

    const roofMat =
        new THREE.MeshStandardMaterial({
            color:0x374151
        });

    const roof =
        new THREE.Mesh(
            roofGeo,
            roofMat
        );

    roof.position.set(
        x,
        7.8,
        z
    );

    roof.rotation.y =
        Math.PI/4;

    roof.castShadow = true;

    castle.add(roof);
}


/* =====================================================
   BİRLİK SEÇ
   ===================================================== */

function selectUnit(type){

    if(gameOver) return;

    selectedUnit = type;

    document
        .querySelectorAll(".unitButton")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

    document
        .getElementById(type+"Btn")
        .classList.add("selected");

    const names = {
        knight:"⚔️ Şövalye hazır!",
        archer:"🏹 Okçu hazır!",
        giant:"🔨 Dev hazır!"
    };

    document.getElementById(
        "message"
    ).innerText = names[type];

    attack();
}


/* =====================================================
   SALDIRI
   ===================================================== */

function attack(){

    if(gameOver || attacking)
        return;

    attacking = true;

    const data =
        unitData[selectedUnit];

    const unit =
        createUnit(
            selectedUnit
        );

    scene.add(unit);

    activeUnits.push(unit);

    unit.position.set(
        -6,
        0,
        0
    );


    const targetX = 6;

    const start =
        performance.now();

    const duration =
        (12 / data.speed)*1000;


    function move(time){

        const progress =
            Math.min(
                (time-start)/duration,
                1
            );

        unit.position.x =
            -6 +
            (12*progress);

        unit.position.y =
            Math.abs(
                Math.sin(progress*Math.PI)
            )*.3;


        if(progress < 1){

            requestAnimationFrame(move);

        }else{

            scene.remove(unit);

            const index =
                activeUnits.indexOf(unit);

            if(index>=0)
                activeUnits.splice(index,1);


            hitCastle(
                data.damage
            );

            attacking = false;
        }
    }

    requestAnimationFrame(move);
}


/* =====================================================
   BİRLİK OLUŞTUR
   ===================================================== */

function createUnit(type){

    const group =
        new THREE.Group();


    if(type === "knight"){

        createKnight(group);

    }else if(type === "archer"){

        createArcher(group);

    }else{

        createGiant(group);
    }


    return group;
}


/* =====================================================
   ŞÖVALYE
   ===================================================== */

function createKnight(group){

    const armor =
        new THREE.MeshStandardMaterial({
            color:0x64748b,
            metalness:.7,
            roughness:.3
        });


    const skin =
        new THREE.MeshStandardMaterial({
            color:0xf2c6a0
        });


    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .55,
                .65,
                1.5,
                10
            ),
            armor
        );

    body.position.y=1.5;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .45,
                12,
                10
            ),
            skin
        );

    head.position.y=2.55;

    group.add(head);


    const helmet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .52,
                12,
                8,
                0,
                Math.PI*2,
                0,
                Math.PI/2
            ),
            armor
        );

    helmet.position.y=2.65;

    group.add(helmet);


    /* KILIÇ */

    const sword =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                1.6,
                .18
            ),
            new THREE.MeshStandardMaterial({
                color:0xe5e7eb,
                metalness:.9
            })
        );

    sword.position.set(
        .8,
        1.5,
        0
    );

    sword.rotation.z =
        -.45;

    group.add(sword);


    /* KALKAN */

    const shield =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .55,
                .55,
                .18,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x2563eb
            })
        );

    shield.rotation.z =
        Math.PI/2;

    shield.position.set(
        -.7,
        1.5,
        0
    );

    group.add(shield);
}


/* =====================================================
   OKÇU
   ===================================================== */

function createArcher(group){

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:0x166534
        });

    const skin =
        new THREE.MeshStandardMaterial({
            color:0xf2c6a0
        });


    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .5,
                .6,
                1.5,
                10
            ),
            bodyMat
        );

    body.position.y=1.5;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .45,
                12,
                10
            ),
            skin
        );

    head.position.y=2.55;

    group.add(head);


    /* YAY */

    const bow =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .65,
                .06,
                8,
                20,
                Math.PI
            ),
            new THREE.MeshStandardMaterial({
                color:0x92400e
            })
        );

    bow.rotation.y =
        Math.PI/2;

    bow.position.x=.7;

    bow.position.y=1.6;

    group.add(bow);


    /* OK */

    const arrow =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .035,
                1.4,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0x78350f
            })
        );

    arrow.rotation.z =
        Math.PI/2;

    arrow.position.set(
        .9,
        1.6,
        0
    );

    group.add(arrow);
}

   DEV
   ====================
